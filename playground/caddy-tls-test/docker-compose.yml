services:
  caddy:
    image: caddy:2.8-alpine
    container_name: tls-test-caddy
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - deploy_default

volumes:
  caddy_data:
  caddy_config:

networks:
  deploy_default:
    external: true
    name: deploy_default
