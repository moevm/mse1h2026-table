services:
  app:
    container_name: app-server
    image: nextcloud:fpm
    restart: always
    environment:
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      # SQLite для теста
      - SQLITE_DATABASE=nextcloud
      # чтобы Nextcloud адекватно жил за nginx
      - TRUSTED_PROXIES=nginx-server
      - OVERWRITEHOST=localhost
      - OVERWRITEPROTOCOL=http
      - OVERWRITECLIURL=http://nginx-server
    volumes:
      - app_data:/var/www/html
    depends_on:
      - onlyoffice-document-server

  onlyoffice-document-server:
    container_name: onlyoffice-document-server
    image: onlyoffice/documentserver:latest
    restart: always
    environment:
      - JWT_SECRET=secret
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice

  nginx:
    container_name: nginx-server
    image: nginx:alpine
    restart: always
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - app_data:/var/www/html:ro
    depends_on:
      - app

  nextcloud-init:
    image: nextcloud:fpm
    depends_on:
      - app
      - onlyoffice-document-server
      - nginx
    volumes:
      - app_data:/var/www/html
    entrypoint: >
      sh -c "
        echo 'Waiting for Nextcloud to be INSTALLED...';
        until php /var/www/html/occ status 2>/dev/null | grep -q \"installed: true\"; do sleep 2; done;

        echo 'Configuring ONLYOFFICE via occ...';

        php /var/www/html/occ app:install onlyoffice || php /var/www/html/occ app:enable onlyoffice;

        php /var/www/html/occ config:app:set onlyoffice DocumentServerUrl --value='http://localhost/onlyoffice/';
        php /var/www/html/occ config:app:set onlyoffice DocumentServerInternalUrl --value='http://onlyoffice-document-server/';
        php /var/www/html/occ config:app:set onlyoffice StorageUrl --value='http://nginx-server/';
        php /var/www/html/occ config:app:set onlyoffice jwt_secret --value='secret';

        php /var/www/html/occ config:system:set overwrite.cli.url --value='http://nginx-server' --type=string;
        php /var/www/html/occ config:system:set overwritehost --value='localhost' --type=string;
        php /var/www/html/occ config:system:set overwriteprotocol --value='http' --type=string;
        php /var/www/html/occ config:system:set trusted_proxies 0 --value='nginx-server' --type=string;
        php /var/www/html/occ config:system:set trusted_domains 0 --value='localhost' --type=string;
        php /var/www/html/occ config:system:set trusted_domains 1 --value='nginx-server' --type=string;

        echo 'ONLYOFFICE configured OK';
      "
    restart: "no"

volumes:
  document_data:
  document_log:
  app_data: