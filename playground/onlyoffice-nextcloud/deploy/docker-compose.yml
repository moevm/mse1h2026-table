services:
  app:
    container_name: app-server
    image: nextcloud:fpm
    restart: always
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      # SQLite для теста
      - SQLITE_DATABASE=nextcloud
      # чтобы Nextcloud адекватно жил за nginx
      - TRUSTED_PROXIES=nginx-server
      - OVERWRITEHOST=localhost:8080
      - OVERWRITEPROTOCOL=http
      - OVERWRITECLIURL=http://localhost:8080
    volumes:
      - app_data:/var/www/html
    depends_on:
      - onlyoffice-document-server

  onlyoffice-document-server:
    container_name: onlyoffice-document-server
    image: onlyoffice/documentserver:latest
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice

  nginx:
    container_name: nginx-server
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - app_data:/var/www/html:ro
    depends_on:
      - app

  nextcloud-init:
    image: nextcloud:fpm
    depends_on:
      - app
      - onlyoffice-document-server
      - nginx
    volumes:
      - app_data:/var/www/html
    entrypoint: >
      sh -c "
        echo 'Waiting for Nextcloud to be INSTALLED...';
        until php /var/www/html/occ status 2>/dev/null | grep -q \"installed: true\"; do sleep 2; done;

        echo 'Configuring ONLYOFFICE via occ...';

        php /var/www/html/occ app:install onlyoffice || php /var/www/html/occ app:enable onlyoffice;

        php /var/www/html/occ config:app:set onlyoffice DocumentServerUrl --value='http://localhost:8080/onlyoffice/';
        php /var/www/html/occ config:app:set onlyoffice DocumentServerInternalUrl --value='http://onlyoffice-document-server/';
        php /var/www/html/occ config:app:set onlyoffice StorageUrl --value='http://nginx-server/';
        php /var/www/html/occ config:app:set onlyoffice jwt_secret --value='${JWT_SECRET}';

        php /var/www/html/occ config:system:set overwrite.cli.url --value='http://localhost:8080' --type=string;
        php /var/www/html/occ config:system:set overwritehost --value='localhost:8080' --type=string;
        php /var/www/html/occ config:system:set overwriteprotocol --value='http' --type=string;
        php /var/www/html/occ config:system:set trusted_proxies 0 --value='nginx-server' --type=string;
        php /var/www/html/occ config:system:set trusted_domains 0 --value='localhost' --type=string;
        php /var/www/html/occ config:system:set trusted_domains 1 --value='localhost:8080' --type=string;
        php /var/www/html/occ config:system:set trusted_domains 2 --value='nginx-server' --type=string;
        php /var/www/html/occ config:system:set trusted_domains 3 --value='host.docker.internal' --type=string;
        php /var/www/html/occ config:system:set trusted_domains 4 --value='host.docker.internal:8080' --type=string;

        php /var/www/html/occ app:enable oauth2;
        php /var/www/html/occ app:install webhook_listeners || php /var/www/html/occ app:enable webhook_listeners;
        php /var/www/html/occ app:install forms || php /var/www/html/occ app:enable forms;
        php /var/www/html/occ app:install integration_windmill || php /var/www/html/occ app:enable integration_windmill;

        echo 'ONLYOFFICE and Windmill integration apps configured OK';
      "
    restart: "no"

  windmill-db:
    container_name: windmill-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: windmill
      POSTGRES_USER: ${WINDMILL_DB_USER}
      POSTGRES_PASSWORD: ${WINDMILL_DB_PASSWORD}
    volumes:
      - windmill_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WINDMILL_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  windmill:
    container_name: windmill-server
    image: ghcr.io/windmill-labs/windmill:latest
    restart: always
    ports:
      - "${WINDMILL_PORT}:8000"
    environment:
      - DATABASE_URL=postgres://${WINDMILL_DB_USER}:${WINDMILL_DB_PASSWORD}@windmill-db:5432/windmill?sslmode=disable
      - BASE_URL=http://localhost:${WINDMILL_PORT}
      - RUST_LOG=info
    depends_on:
      windmill-db:
        condition: service_healthy
    volumes:
      - windmill_worker_logs:/tmp/windmill

  windmill-worker:
    container_name: windmill-worker
    image: ghcr.io/windmill-labs/windmill:latest
    restart: always
    command: windmill worker
    environment:
      - DATABASE_URL=postgres://${WINDMILL_DB_USER}:${WINDMILL_DB_PASSWORD}@windmill-db:5432/windmill?sslmode=disable
      - BASE_URL=http://localhost:${WINDMILL_PORT}
      - RUST_LOG=info
      - WORKER_TAGS=deno,python3,go,bash,worker
    depends_on:
      windmill-db:
        condition: service_healthy
    volumes:
      - windmill_worker_logs:/tmp/windmill

volumes:
  document_data:
  document_log:
  app_data:
  windmill_db_data:
  windmill_worker_logs: