environment: dev


services:
  table_url: "https://tables-example.ru"
  form_url: "https://forms-example.ru"


backup:
  directory: "./backups"


exports:
  sources:
    gitlogger:
      kind: subprocess
      cwd: ../include/github_repo_commitment_calc
      mode_flags:
        commits: -c
        issues: -i
        pull_requests: -p
        invites: --invites
        wikis: -w
        contributors: --contributors
        workflow_runs: --workflow_runs
      command:
        - "{python}"
        - "main.py"
        - "{mode_flag}"
        - "-t"
        - "{gitlogger_token}"
        - "-l"
        - "{gitlogger_repo_list}"
        - "-o"
        - "{csv_abs_path}"
      csv_path: "./artifacts/gitlogger/{mode}.csv"
      xlsx_path: "./artifacts/gitlogger/{mode}.xlsx"
      xlsx_sheet_name: "{mode}"
      build_xlsx: true

    lms_stepik:
      kind: subprocess
      cwd: ../include/lms_grades_export/stepik_progress_export
      command:
        - "{python}"
        - "main.py"
        - "--client_id"
        - "{stepik_client_id}"
        - "--client_secret"
        - "{stepik_client_secret}"
        - "--course_id"
        - "{course_id}"
        - "--class_id"
        - "{class_id}"
        - "--csv_path"
        - "{csv_path}"
      csv_path: "./artifacts/lms/stepik.csv"
      xlsx_path: "./artifacts/lms/stepik.xlsx"
      xlsx_sheet_name: "stepik"
      build_xlsx: true

    lms_moodle:
      kind: subprocess
      cwd: ../include/lms_grades_export/common_grade_export/src/exporters
      command:
        - "{python}"
        - "moodle_exporter.py"
        - "--url"
        - "{moodle_url}"
        - "--moodle_token"
        - "{moodle_token}"
        - "--course_id"
        - "{course_id}"
        - "--csv_path"
        - "{csv_path}"
      csv_path: "./artifacts/lms/moodle.csv"
      xlsx_path: "./artifacts/lms/moodle.xlsx"
      xlsx_sheet_name: "moodle"
      build_xlsx: true

    # Любой новый модуль добавляется вот так:
    # custom_source:
    #   kind: subprocess
    #   cwd: ../include/some_project
