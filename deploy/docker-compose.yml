services:
  app:
    container_name: app-server
    image: nextcloud:33.0-fpm
    restart: always
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - app_data:/var/www/html
      - ./php-fpm-pool.conf:/usr/local/etc/php-fpm.d/zzz-pool.conf:ro
      - ./php-fpm-logging.conf:/usr/local/etc/php-fpm.d/zz-logging.conf:ro,Z # nginx уже логирует
    depends_on:
      db:
        condition: service_healthy
        restart: true
      onlyoffice-document-server:
        condition: service_started

  db:
    image: postgres:18
    container_name: nextcloud-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql

  onlyoffice-document-server:
    container_name: onlyoffice-document-server
    image: onlyoffice/documentserver:9.3
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET}
      # Без этого external links между xlsx падают: request-filtering-agent в DS
      # режет private IP. См. /app/ds/run-document-server.sh:433-436.
      - ALLOW_PRIVATE_IP_ADDRESS=true
    extra_hosts:
      # DS должен резолвить тот же hostname, через который user зашёл в NC, обратно
      # на хост-машину - иначе callback на localhost:8080 падает в ECONNREFUSED.
      - "${NEXTCLOUD_HOSTNAME}:host-gateway"
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice

  nginx:
    container_name: nginx-server
    image: nginx:stable-alpine
    restart: always
    environment:
      - TZ=${TZ}
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - app_data:/var/www/html:ro
    depends_on:
      - app

  nextcloud-init:
    image: nextcloud:33.0-fpm
    depends_on:
      - app
      - onlyoffice-document-server
      - nginx
    volumes:
      - app_data:/var/www/html
    environment:
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_PORT=${NEXTCLOUD_PORT:-8080}
      - NEXTCLOUD_TRUSTED_PROXIES=${NEXTCLOUD_TRUSTED_PROXIES}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=${TZ}
    entrypoint: >
      sh -c '
        echo "Waiting for Nextcloud to be INSTALLED...";
        until php /var/www/html/occ status 2>/dev/null | grep -q "installed: true"; do sleep 2; done;

        echo "Configuring ONLYOFFICE via occ...";

        php /var/www/html/occ app:install onlyoffice || php /var/www/html/occ app:enable onlyoffice;

        NEXTCLOUD_HOST="$${NEXTCLOUD_URL#*://}"
        NEXTCLOUD_HOST="$${NEXTCLOUD_HOST%%/*}"
        NEXTCLOUD_HOST="$${NEXTCLOUD_HOST%%:*}"

        php /var/www/html/occ config:app:set onlyoffice DocumentServerUrl --value="/ds-vpath/";
        php /var/www/html/occ config:app:set onlyoffice DocumentServerInternalUrl --value="http://onlyoffice-document-server/";
        php /var/www/html/occ config:app:set onlyoffice StorageUrl --value="http://nginx-server/";
        php /var/www/html/occ config:app:set onlyoffice jwt_secret --value="$${JWT_SECRET}";
        php /var/www/html/occ config:app:set onlyoffice customizationForcesave --value=true

        # callback URL для server-side (DS external links) идёт через docker-network
        # hostname. overwriteprotocol/overwritehost НЕ ставим - петля на /login.
        php /var/www/html/occ config:system:set overwrite.cli.url --value="http://nginx-server" --type=string;

        php /var/www/html/occ config:system:set trusted_proxies --value="$${NEXTCLOUD_TRUSTED_PROXIES}" --type=json;
        php /var/www/html/occ config:system:set trusted_domains 0 --value="nginx-server" --type=string;
        php /var/www/html/occ config:system:set trusted_domains 1 --value="$${NEXTCLOUD_HOST}" --type=string;
        php /var/www/html/occ config:system:set trusted_domains 2 --value="$${NEXTCLOUD_HOST}:$${NEXTCLOUD_PORT}" --type=string;
        php /var/www/html/occ config:system:set trusted_domains 3 --value="localhost" --type=string;
        php /var/www/html/occ config:system:set trusted_domains 4 --value="localhost:$${NEXTCLOUD_PORT}" --type=string;
        php /var/www/html/occ config:system:set trusted_domains 5 --value="127.0.0.1" --type=string;
        php /var/www/html/occ config:system:set trusted_domains 6 --value="127.0.0.1:$${NEXTCLOUD_PORT}" --type=string;

        php /var/www/html/occ config:system:set memcache.local --value="\\OC\\Memcache\\APCu" --type=string;
        php /var/www/html/occ background:cron;

        php /var/www/html/occ app:install forms || php /var/www/html/occ app:enable forms;

        # forms нет в shipped apps NC 33 - тянем из appstore до его отключения.
        php /var/www/html/occ config:system:set appstoreenabled --value=false --type=boolean;
        php /var/www/html/occ config:system:set has_internet_connection --value=false --type=boolean;

        php /var/www/html/occ maintenance:repair --include-expensive;
        php /var/www/html/occ db:add-missing-indices;

        echo "ONLYOFFICE and Forms integration apps configured OK";
      '
    restart: "no"

  cron-worker:
    build:
      context: .
      dockerfile: cron-worker.Dockerfile
    image: nextcloud-cron-worker:33.0
    container_name: nextcloud-cron-worker
    restart: always
    user: "www-data"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      nextcloud-init:
        condition: service_completed_successfully
    volumes:
      - app_data:/var/www/html
      - ./cron-worker.sh:/usr/local/bin/cron-worker.sh:ro,Z
    environment:
      - TZ=${TZ}
    entrypoint: ["bash", "/usr/local/bin/cron-worker.sh"]

volumes:
  db_data:
  document_data:
  document_log:
  app_data:

networks:
  default:
    # Фиксируем подсеть, чтобы trusted_proxies в .env матчился именно с нашим
    # bridge'ом, а не с любой другой docker network на машине.
    # Если порт уже занят другим compose-проектом, поменять
    # здесь и в NEXTCLOUD_TRUSTED_PROXIES в .env согласованно.
    ipam:
      config:
        - subnet: 172.28.0.0/16
