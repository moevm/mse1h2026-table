services:
  app:
    container_name: app-server
    image: nextcloud:33.0-fpm
    restart: always
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      # PostgreSQL settings
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - app_data:/var/www/html
      - ./php-fpm-logging.conf:/usr/local/etc/php-fpm.d/zz-logging.conf:ro,Z # disable php access logging, nginx already logs them
    depends_on:
      db:
        condition: service_healthy
        restart: true
      onlyoffice-document-server:
        condition: service_started

  db:
    image: postgres:18
    container_name: nextcloud-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql

  onlyoffice-document-server:
    container_name: onlyoffice-document-server
    image: onlyoffice/documentserver:9.3
    restart: always
    environment:
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice

  nginx:
    container_name: nginx-server
    image: nginx:stable-alpine
    restart: always
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - app_data:/var/www/html:ro
    depends_on:
      - app

  nextcloud-init:
    image: nextcloud:33.0-fpm
    depends_on:
      - app
      - onlyoffice-document-server
      - nginx
    volumes:
      - app_data:/var/www/html
    entrypoint: >
      sh -c '
        echo "Waiting for Nextcloud to be INSTALLED...";
        until php /var/www/html/occ status 2>/dev/null | grep -q "installed: true"; do sleep 2; done;

        echo "Configuring ONLYOFFICE via occ...";

        php /var/www/html/occ app:install onlyoffice || php /var/www/html/occ app:enable onlyoffice;

        NEXTCLOUD_URL="${NEXTCLOUD_URL}"
        NEXTCLOUD_SCHEME="$${NEXTCLOUD_URL%%://*}"
        NEXTCLOUD_HOSTPORT="$${NEXTCLOUD_URL#*://}"
        NEXTCLOUD_HOSTPORT="$${NEXTCLOUD_HOSTPORT%%/*}"

        php /var/www/html/occ config:app:set onlyoffice DocumentServerUrl --value="$${NEXTCLOUD_URL}/ds-vpath/";
        php /var/www/html/occ config:app:set onlyoffice DocumentServerInternalUrl --value="http://onlyoffice-document-server/";
        php /var/www/html/occ config:app:set onlyoffice StorageUrl --value="http://nginx-server/";
        php /var/www/html/occ config:app:set onlyoffice jwt_secret --value="${JWT_SECRET}";
        php /var/www/html/occ config:app:set onlyoffice customizationForcesave --value=true

        php /var/www/html/occ config:system:set overwrite.cli.url --value="$${NEXTCLOUD_URL}" --type=string;
        php /var/www/html/occ config:system:set overwritehost --value="$${NEXTCLOUD_HOSTPORT}" --type=string;
        php /var/www/html/occ config:system:set overwriteprotocol --value="$${NEXTCLOUD_SCHEME}" --type=string;
        php /var/www/html/occ config:system:set trusted_proxies --value="$${NEXTCLOUD_TRUSTED_PROXIES}" --type=json;

        php /var/www/html/occ app:enable oauth2;
        php /var/www/html/occ app:install webhook_listeners || php /var/www/html/occ app:enable webhook_listeners;
        php /var/www/html/occ app:install forms || php /var/www/html/occ app:enable forms;
        php /var/www/html/occ app:install integration_windmill || php /var/www/html/occ app:enable integration_windmill;

        php /var/www/html/occ maintenance:repair --include-expensive;
        php /var/www/html/occ db:add-missing-indices;

        echo "ONLYOFFICE and Windmill integration apps configured OK";
      '
    restart: "no"

  cron-worker:
    image: nextcloud:33.0-fpm
    container_name: nextcloud-cron-worker
    restart: always
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      nextcloud-init:
        condition: service_completed_successfully
    volumes:
      - app_data:/var/www/html
      - ./cron-worker.sh:/usr/local/bin/cron-worker.sh:ro,Z
    entrypoint: >
      sh -c "
        echo 'installing (jq, sudo)...';
        apt-get update -qq && apt-get install -y -qq jq sudo > /dev/null;
        echo 'script start...';
        exec sudo -u www-data bash /usr/local/bin/cron-worker.sh
      "

  windmill-db:
    container_name: windmill-db
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: windmill
      POSTGRES_USER: ${WINDMILL_DB_USER}
      POSTGRES_PASSWORD: ${WINDMILL_DB_PASSWORD}
    volumes:
      - windmill_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WINDMILL_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  windmill:
    container_name: windmill-server
    image: ghcr.io/windmill-labs/windmill:1.657.2
    restart: always
    ports:
      - "${WINDMILL_PORT}:8000"
    environment:
      - DATABASE_URL=postgres://${WINDMILL_DB_USER}:${WINDMILL_DB_PASSWORD}@windmill-db:5432/windmill?sslmode=disable
      - BASE_URL=http://${NEXTCLOUD_HOST}:${WINDMILL_PORT}
      - RUST_LOG=info
    extra_hosts:
      - "${NEXTCLOUD_HOST:-nextcloud.local}:host-gateway"
    depends_on:
      windmill-db:
        condition: service_healthy
    volumes:
      - windmill_worker_logs:/tmp/windmill

  windmill-worker:
    container_name: windmill-worker
    image: ghcr.io/windmill-labs/windmill:1.657.2
    restart: always
    command: windmill worker
    environment:
      - DATABASE_URL=postgres://${WINDMILL_DB_USER}:${WINDMILL_DB_PASSWORD}@windmill-db:5432/windmill?sslmode=disable
      - BASE_URL=http://${NEXTCLOUD_HOST}:${WINDMILL_PORT}
      - RUST_LOG=info
    extra_hosts:
      - "${NEXTCLOUD_HOST:-nextcloud.local}:host-gateway"
    depends_on:
      windmill-db:
        condition: service_healthy
    volumes:
      - windmill_worker_logs:/tmp/windmill

volumes:
  db_data:
  document_data:
  document_log:
  app_data:
  windmill_db_data:
  windmill_worker_logs:
