services:
  app:
    container_name: app-server
    image: nextcloud:33.0-fpm
    restart: always
    cpus: "8.0"
    cpuset: "0-7"
    mem_limit: 4g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/html/occ status 2>/dev/null | grep -q 'installed: true'"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - app_data:/var/www/html
      - ./php-fpm-pool.conf:/usr/local/etc/php-fpm.d/zzz-pool.conf:ro,Z
      - ./php-fpm-logging.conf:/usr/local/etc/php-fpm.d/zz-logging.conf:ro,Z # nginx уже логирует
    depends_on:
      db:
        condition: service_healthy
        restart: true
      onlyoffice-document-server:
        condition: service_started

  db:
    image: postgres:18
    container_name: nextcloud-db
    restart: always
    cpus: "2.0"
    cpuset: "0-7"
    mem_limit: 2g
    mem_reservation: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nextcloud}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql

  onlyoffice-document-server:
    container_name: onlyoffice-document-server
    image: onlyoffice/documentserver:9.3
    restart: always
    cpus: "4.0"
    cpuset: "0-7"
    mem_limit: 3g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/healthcheck || exit 1"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s
    environment:
      - JWT_SECRET=${JWT_SECRET}
      # Без этого external links между xlsx падают: request-filtering-agent в DS
      # режет private IP. См. /app/ds/run-document-server.sh:433-436.
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - TZ=${TZ}
    extra_hosts:
      # DS должен резолвить тот же hostname, через который user зашёл в NC, обратно
      # на хост-машину - иначе callback на localhost:8080 падает в ECONNREFUSED.
      - "${NEXTCLOUD_HOSTNAME}:host-gateway"
    volumes:
      - document_data:/var/www/onlyoffice/Data
      - document_log:/var/log/onlyoffice

  nginx:
    container_name: nginx-server
    image: nginx:stable-alpine
    restart: always
    cpus: "2.0"
    cpuset: "0-7"
    mem_limit: 512m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 30s
      retries: 3
      start_period: 60s
      timeout: 10s
    environment:
      - TZ=${TZ}
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - app_data:/var/www/html:ro
    depends_on:
      - app

  nextcloud-init:
    image: nextcloud:33.0-fpm
    cpus: "1.0"
    cpuset: "0-7"
    mem_limit: 512m
    mem_reservation: 256m
    depends_on:
      - app
      - onlyoffice-document-server
      - nginx
    volumes:
      - app_data:/var/www/html
      - ./nextcloud-init.sh:/usr/local/bin/nextcloud-init.sh:ro,Z
    environment:
      - NEXTCLOUD_HOST=${NEXTCLOUD_HOSTNAME}
      - NEXTCLOUD_TRUSTED_PROXIES=${NEXTCLOUD_TRUSTED_PROXIES}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=${TZ}
    entrypoint: ["bash", "/usr/local/bin/nextcloud-init.sh"]
    command: []
    restart: "no"

  cron-worker:
    build:
      context: .
      dockerfile: cron-worker.Dockerfile
    image: nextcloud-cron-worker:33.0
    container_name: nextcloud-cron-worker
    restart: always
    cpus: "2.0"
    cpuset: "0-7"
    mem_limit: 1g
    mem_reservation: 256m
    user: "www-data"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      nextcloud-init:
        condition: service_completed_successfully
    volumes:
      - app_data:/var/www/html
      - ./cron-worker.sh:/usr/local/bin/cron-worker.sh:ro,Z
    environment:
      - TZ=${TZ}
      - CRON_INTERVAL=${CRON_INTERVAL}
      - SYNC_INTERVAL=${SYNC_INTERVAL}
    entrypoint: ["bash", "/usr/local/bin/cron-worker.sh"]
    command: []

  # Контейнеризованный manage.py CLI. Не стартует с обычным `up` (profiles: tools).
  # Запуск: ./bin/table-cli <args> - wrapper экспортирует REPO_ROOT и зовёт
  # `docker compose --profile tools run --rm cli <args>`.
  #
  # Ключевые особенности:
  # - mount /var/run/docker.sock - для backup/restore/monitor, которые делают
  #   `docker compose exec` (maintenance:mode, pg_dump, tar, docker stats и т.д.).
  # - bind-mount репо по тому же абсолютному пути ${REPO_ROOT} - чтобы из cli
  #   можно было звать `docker compose -f $REPO_ROOT/deploy/docker-compose.yml ...`
  #   и относительные mount'ы (./nginx.conf, ./php-fpm-pool.conf) резолвились в
  #   пути, существующие на хосте (демон бежит на хосте, не в cli).
  # - NEXTCLOUD_URL по умолчанию указывает на nginx-server (DNS compose-сети);
  #   host-Python путь не затрагивается, у него default `http://localhost:8080`.
  cli:
    build:
      context: ../table
      dockerfile: Dockerfile
    image: mse1h2026-table-cli:latest
    profiles: ["tools"]
    cpus: "1.0"
    cpuset: "0-7"
    mem_limit: 512m
    mem_reservation: 256m
    # Не подключаем cli к default-сети стэка: иначе `deploy down` оставляет
    # сеть с "Resource is still in use", пока сам cli ещё работает в ней.
    # Cli ходит на nginx через host-gateway (host'овый порт NEXTCLOUD_PORT).
    network_mode: bridge
    extra_hosts:
      - "nginx-server:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPO_ROOT:?REPO_ROOT must be set; use ./bin/table-cli wrapper}:${REPO_ROOT}
    working_dir: ${REPO_ROOT}/table
    environment:
      - NEXTCLOUD_URL=${CLI_NEXTCLOUD_URL:-http://nginx-server:${NEXTCLOUD_PORT:-8080}}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - PYTHONUNBUFFERED=1
      - REPO_ROOT=${REPO_ROOT}
      - TZ=${TZ}

volumes:
  db_data:
  document_data:
  document_log:
  app_data:

networks:
  default:
    name: deploy_default
    # Фиксируем подсеть, чтобы trusted_proxies в .env матчился именно с нашим
    # bridge'ом, а не с любой другой docker network на машине.
    # Если подсеть уже занята другим compose-проектом, поменять
    # здесь и в NEXTCLOUD_TRUSTED_PROXIES в .env согласованно.
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.28.0.0/16
