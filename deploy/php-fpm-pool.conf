; Overlay-конфиг пула php-fpm. Подключается через volume в сервис app
; как /usr/local/etc/php-fpm.d/zzz-pool.conf - алфавитный суффикс zzz-
; гарантирует, что значения переопределяют defaults из www.conf и
; перекрывают пустую [www] секцию из zz-docker.conf.
;
; Зачем: дефолтный пул в nextcloud:33-fpm имеет pm.max_children=5.
; При браузерной загрузке dashboard'а NC шлёт ~30 параллельных запросов;
; с пулом 5 они становятся в очередь по 6 раундов, страница грузится
; десятки секунд. 30 worker'ов закрывают пиковую параллельность для
; одного активного пользователя и оставляют запас на ~5-10 пользователей.

[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
